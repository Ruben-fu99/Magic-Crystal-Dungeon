function rerollGear(it){

  Object.assign(it,{stats:n.stats,name:n.name,trait:n.trait,set:n.set});

function mergeQ(){
  const worn=new Set(Object.values(save.geareq)),cnt={};
  for(const it of save.gear)if(!worn.has(it.uid)&&it.q<5)cnt[it.q]=(cnt[it.q]||0)+1;
  for(let q=1;q<5;q++)if(cnt[q]>=3)return q;
  return 0;
}
function mergeGear(){

/* ---------- chat ---------- */
let hubRoom=null,hubJoining=false,hubChat=[],hubUnsub=[],dmTo='';
function cleanText(s){return String(s||'').replace(/[\u0000-\u001f]/g,' ').slice(0,60);}
function myPresence(){return {n:(save.name||'勇者').slice(0,10),fc:save.fc,sel:save.sel};}
async function hubJoin(){
  if(hubRoom||hubJoining||!netRoomNs)return;
  hubJoining=true;
  try{
    const r=await netRoomNs.join('mjd-lobby');
    if(tab!=='friends'||!menuEl||menuEl.classList.contains('hidden')){try{r.leave();}catch(e){}hubJoining=false;return;}
    hubRoom=r;
    hubUnsub.push(r.on('chat',m=>{if(m&&!m.isMe&&m.data)hubPush({from:cleanText(m.data.n).slice(0,10)||'勇者',fc:cleanText(m.data.fc),text:cleanText(m.data.t)});}));
    hubUnsub.push(r.on('dm',m=>{
      if(!m||m.isMe||!m.data||m.data.to!==save.fc)return;
      hubPush({from:cleanText(m.data.n).slice(0,10)||'勇者',fc:cleanText(m.data.fc),text:cleanText(m.data.t),dm:true,inv:cleanText(m.data.inv)});
    }));
    hubUnsub.push(r.onPeers(()=>{if(tab==='friends')refreshFriends();}));
    await r.presence(myPresence());
  }catch(e){hubRoom=null;}
  hubJoining=false;if(tab==='friends')refreshFriends();
}
function hubLeave(){
  for(const u of hubUnsub){try{u();}catch(e){}}hubUnsub=[];
  if(hubRoom){try{hubRoom.leave();}catch(e){}hubRoom=null;}
}
function hubPeers(){
  if(!hubRoom)return [];
  try{return hubRoom.peers().filter(q=>!q.isMe&&q.presence&&q.presence.fc).map(q=>({fc:cleanText(q.presence.fc),n:cleanText(q.presence.n).slice(0,10)||'勇者'}));}catch(e){return [];}
}
function hubPush(m){hubChat.push(m);if(hubChat.length>80)hubChat.shift();
  const f=save.friends.find(x=>x.fc===m.fc);if(f&&m.from)f.name=m.from;
  if(tab==='friends')refreshFriends();}
let lastSend=0;
function hubSend(text,to,inv){
  text=cleanText(text).trim();if(!text&&!inv)return;
  if(Date.now()-lastSend<900)return;lastSend=Date.now();
  if(!hubRoom){hubPush({from:'系統',text:'尚未連線到大廳，無法送出',sys:true});return;}
  const d={n:(save.name||'勇者').slice(0,10),fc:save.fc,t:text};
  try{
    if(to){d.to=to;if(inv)d.inv=inv;hubRoom.emit('dm',d);hubPush({from:'我→'+((save.friends.find(f=>f.fc===to)||{}).name||to),fc:save.fc,text:text||'（邀請）',dm:true,mine:true});}
    else{hubRoom.emit('chat',d);hubPush({from:'我',fc:save.fc,text,mine:true});}
  }catch(e){hubPush({from:'系統',text:'送出失敗',sys:true});}
}
let flBox=null,logBox=null;

  if(!flBox||!logBox||!flBox.isConnected)return;
  const peers=hubPeers(),on=new Set(peers.map(p=>p.fc));

    const b3=el('button','btn','移除');b3.type='button';b3.addEventListener('click',()=>{save.friends=save.friends.filter(x=>x!==f);if(dmTo===f.fc)dmTo='';persist();refreshFriends();});
    r.append(b1,b2,b3);it.appendChild(r);fl.appendChild(it);
  }
  if(!save.friends.length)fl.appendChild(el('p','note','還沒有好友。輸入對方的好友代碼，或在下方「線上玩家」點加好友。'));
  flBox.appendChild(fl);
  flBox.appendChild(el('b','','線上玩家（大廳）'));
  const ol=el('div','fl');
  for(const p of peers){
    const it=el('div','item');it.append(el('b','',p.n),el('small','','代碼 '+p.fc));
    if(!save.friends.some(f=>f.fc===p.fc)){const b=el('button','btn','加好友');b.type='button';b.addEventListener('click',()=>{save.friends.push({fc:p.fc,name:p.n});persist();refreshFriends();});it.appendChild(b);}

const CSK={
 knight:['dual','barrier','rage','nova'],rogue:['dash','slow','chain','thunder'],mage:['nova','slow','chain','voidp'],
 shade:['rally','shades','absorb','voidp'],ooze:['absorb','heal','barrier','nova'],tinker:['turret','chain','overclock','thunder'],
 hunter:['grapple','slow','volley','chain'],pirate:['barrage','dash','rage','giant'],monk:['kiburst','heal','barrier','nova'],
 giant:['giant','rage','nova','barrier'],ranger:['volley','dash','slow','thunder'],vampire:['drain','heal','rage','voidp'],
 alchemist:['flask','slow','absorb','nova'],samurai:['iai','dash','rage','chain'],strategist:['firewall','barrier','slow','thunder'],
 hacker:['overclock','chain','dash','voidp']
};
const CSK_LV=[1,5,10,15];
function clv(id){const c=save.cl&&save.cl[id];return c?c.lv:1;}
function xpNeed(lv){return 60+40*lv;}
function charSkills(id){return (CSK[id]||[]).map((s,i)=>({id:s,lv:CSK_LV[i],ok:clv(id)>=CSK_LV[i]}));}
function availSk(id){const set=new Set();for(const c of charSkills(id))if(c.ok&&SKILLS[c.id])set.add(c.id);for(const s of save.skills)set.add(s);return [...set];}
function selSk(id){
  const av=availSk(id);let s=((save.csel&&save.csel[id])||[]).filter(x=>av.includes(x));
  if(!s.length){s=[(CSK[id]||[])[0]||'dual'];if(save.eq&&av.includes(save.eq)&&save.eq!==s[0])s.push(save.eq);}
  return s.slice(0,2);
}
function toggleSk(id,sk){
  let s=selSk(id);
  if(s.includes(sk)){if(s.length>1)s=s.filter(x=>x!==sk);}
  else{if(s.length>=2)s.shift();s.push(sk);}
  if(!save.csel)save.csel={};save.csel[id]=s;persist();
}
function addCharXp(id,xp){
  if(!save.cl)save.cl={};const c=save.cl[id]||(save.cl[id]={lv:1,xp:0});const o=c.lv;
  c.xp+=xp;while(c.lv<60&&c.xp>=xpNeed(c.lv)){c.xp-=xpNeed(c.lv);c.lv++;}if(c.lv>=60)c.xp=0;
  return [o,c.lv];
}
function lvBonusText(L){return '傷害 +'+(1.5*(L-1)).toFixed(1)+'%　生命 +'+Math.floor((L-1)/5)+'　能量 +'+3*(L-1)+'　移速 +'+(0.4*(L-1)).toFixed(1)+'%';}
function lvMul(){return 1+.03*((G.clv||1)-1);}
function dmgMul(){return 1.3*(1+.04*depthF())*lvMul()*(G.co?1+.3*netCount():1);}
function rndRound(x){const f=Math.floor(x);return f+(Math.random()<x-f?1:0);}

function genPattern(R,kind){
  const g=blankGrid(),W1=(c,r)=>place(g,c,r,1,1,1),C1=(c,r)=>place(g,c,r,1,1,2),L1=(c,r)=>place(g,c,r,1,1,8);
  if(kind==='pillars'){for(let c=5;c<=14;c+=3)for(let r=2;r<=9;r+=3)W1(c,r);}
  else if(kind==='ring'){for(let c=7;c<=12;c++)for(let r=3;r<=8;r++){if(c>7&&c<12&&r>3&&r<8)continue;if((c===9||c===10)&&(r===3||r===8))continue;if((r===5||r===6)&&(c===7||c===12))continue;W1(c,r);}}
  else if(kind==='cross'){for(let i=4;i<=15;i++){if(i===9||i===10)continue;C1(i,5);C1(i,6);}for(let r=1;r<=10;r++){if(r===5||r===6)continue;if(r===3||r===8)continue;W1(9,r);W1(10,r);}}
  else if(kind==='corridors'){for(let c=4;c<=15;c++){if(c===7||c===12)continue;W1(c,4);W1(c,7);}}
  else if(kind==='islands'){const n=R.ri(4,6);for(let i=0;i<n;i++){const c=R.ri(4,9),r=R.ri(1,9);place(g,c,r,2,2,R.f()<.5?1:2);place(g,COLS-c-2,r,2,2,R.f()<.5?1:2);}}
  else if(kind==='diamond'){for(let r=1;r<=10;r++){const d=Math.abs(r-5.5),w=Math.round(5-d);if(w<=0)continue;if(r===5||r===6)continue;W1(10-w,r);W1(9+w,r);}}
  else if(kind==='checker'){for(let c=5;c<=14;c++)for(let r=2;r<=9;r++)if((c+r)%2===0&&R.f()<.55)C1(c,r);}
  else if(kind==='lavapools'){const n=R.ri(3,4);for(let i=0;i<n;i++){const c=R.ri(5,13),r=R.ri(1,8),w=R.ri(2,3),h=R.ri(2,3);place(g,c,r,w,h,8);}for(let i=0;i<4;i++)W1(R.ri(5,14),R.ri(1,10));}
  else if(kind==='zigzag'){[6,9,12,15].forEach((c,i)=>{for(let k=0;k<6;k++){const r=i%2?10-k:1+k;W1(c,r);}});}
  else if(kind==='fortress'){for(let c=8;c<=11;c++){W1(c,5);W1(c,6);}C1(7,4);C1(12,4);C1(7,7);C1(12,7);L1(6,2);L1(13,9);L1(6,9);L1(13,2);}
  else if(kind==='arena'){for(const [c,r] of [[5,2],[5,9],[14,2],[14,9],[9,3],[10,8]])place(g,c,r,2,1,1);}
  return g;
}
const PATTERNS=['pillars','ring','cross','corridors','islands','diamond','checker','lavapools','zigzag','fortress','arena'];
function genLayout(type,R){
  if(['battle','elite','ambush','pvp'].includes(type)&&R.f()<.7){
    for(let tries=0;tries<6;tries++){
      const kind=PATTERNS[R.ri(0,PATTERNS.length-1)],g=genPattern(R,kind),reach=bfs(g);
      if(reach.has(5*COLS+18)&&reach.has(6*COLS+18)&&reach.size>60)return {grid:g,reach};
    }
  }
  return genLayoutOld(type,R);
}

function pvpSpawn(){const p=G.player,left=(hashStr(String(netUid||'x'))%2)===0;p.x=left?80:W-80;p.y=rnd(100,H-100);}
function startPvp(code){
  if(!netRoomNs||!netUid){toast('PvP 需要登入並連上雲端');return;}
  const old=save.code;save.code='pvp-'+String(code||'open').toLowerCase().replace(/[^a-z0-9_-]/g,'').slice(0,16);

  enterRoom();G.locked=false;G.doorOpen=false;G.waves=0;

}
function pvpOpps(){return others().filter(q=>q.presence&&q.presence.pv&&q.presence.u&&sameRoom(q));}
function pvpSend(q,d){try{netJoined.emit('pvh',{t:q.presence.u,d:Math.min(4,Math.max(1,Math.round(d/5))),by:netUid});}catch(e){}}
function pvpTick(dt){
  const P=G.pvp;if(P.over||!netJoined)return;
  P.t-=dt;
  const opps=pvpOpps(),p=G.player;
  for(const b of G.bullets){
    if(b.src!=='p'||b.dead)continue;
    for(const q of opps){
      const px=Number(q.presence.x)||0,py=Number(q.presence.y)||0;
      b.pvh=b.pvh||{};if(b.pvh[q.peer])continue;
      if(Math.hypot(b.x-px,b.y-py)<(b.r||4)+12){b.pvh[q.peer]=1;pvpSend(q,b.dmg);if((b.pierce||0)>0)b.pierce--;else{b.dead=true;if(b.explode)explode(b.x,b.y,b.explode,0,0,true);break;}}
    }
  }
  for(const s of G.swings){
    if(s.pvd)continue;s.pvd=1;const w=p.w[p.cur],dm=(w&&w.d?w.d.dmg:5)*p.st.dmg;
    for(const q of opps){
      const px=Number(q.presence.x)||0,py=Number(q.presence.y)||0,d=Math.hypot(px-s.x,py-s.y);
      if(d>s.rad+12)continue;let da=Math.abs(Math.atan2(py-s.y,px-s.x)-s.a);if(da>Math.PI)da=TAU-da;if(da<=s.arc/2+.2)pvpSend(q,dm);
    }
  }
  if(P.k>=10||P.t<=0||opps.some(q=>(Number(q.presence.k)||0)>=10)){
    const best=Math.max(0,...opps.map(q=>Number(q.presence.k)||0));
    pvpEnd(P.k>best?1:P.k<best?-1:0);
  }
}
function pvpHitIn(m){
  if(!G||!G.pvp||G.pvp.over||G.state!=='play')return;
  const p=G.player;
  if(m.ko){if(m.t===netUid){G.pvp.k++;addText(p.x,p.y-30,'擊倒！','#ffd166',1.4);sfx(900,.15,'triangle',.05,300);}return;}
  if(m.t!==netUid||p.inv>0)return;
  let rem=m.d;if(p.armor>0){const a=Math.min(p.armor,rem);p.armor-=a;rem-=a;}
  p.hp-=rem;p.inv=.15;p.armorT=0;G.flash=.15;G.shake=Math.max(G.shake,5);sfx(150,.12,'sawtooth',.05,-80);parts(p.x,p.y,6,'#ff5d6c',120,.4,3);
  if(p.hp<=0){
    G.pvp.d++;try{netJoined.emit('pvh',{t:m.by,ko:1});}catch(e){}
    p.hp=p.maxhp;p.armor=p.maxarmor;p.energy=p.maxenergy;p.inv=2;pvpSpawn();addText(p.x,p.y-30,'重生','#ff9a9a',1.2);
  }
}
function pvpEnd(res){

function drawBoss(e,col){
  if(e.design<7){drawBoss3(e,col);return;}
  const x=e.x,y=e.y,r=e.r,f=e.design,t=e.t,sh=e.charge&&e.charge.w>0?rnd(-2,2):0;
  ctx.save();ctx.translate(x+sh,y);shadow(ctx,0,r*.9,r*1.1);
  const eye=e.p2?'#ff3b3b':'#12141c';
  if(f===7){
    ctx.fillStyle='#8fd3ff';ctx.beginPath();ctx.moveTo(0,-r*.2);ctx.lineTo(r*1.0,r*.95);ctx.lineTo(-r*1.0,r*.95);ctx.closePath();ctx.fill();
    ctx.fillStyle='#e8f8ff';ctx.beginPath();ctx.arc(0,-r*.45,r*.38,0,TAU);ctx.fill();
    ctx.fillStyle='#fff';for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*8-4,-r*.75);ctx.lineTo(i*8,-r*(1.1-Math.abs(i)*.08));ctx.lineTo(i*8+4,-r*.75);ctx.fill();}
    ctx.fillStyle=eye;ctx.fillRect(-9,-r*.5,5,6);ctx.fillRect(4,-r*.5,5,6);
    ctx.strokeStyle='rgba(191,239,255,.6)';ctx.lineWidth=2;for(let i=0;i<4;i++){const a=t*1.2+i*Math.PI/2;ctx.beginPath();ctx.arc(Math.cos(a)*r*1.1,Math.sin(a)*r*.5,5,0,TAU);ctx.stroke();}
  }else if(f===8){
    const s=1+Math.sin(t*3)*.04;ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,6,r*1.05*s,r*.8/s,0,0,TAU);ctx.fill();
    ctx.fillStyle='#4a7a2a';ctx.beginPath();ctx.ellipse(0,r*.15,r*.8,r*.35,0,0,Math.PI);ctx.fill();
    ctx.fillStyle='#2a1c14';ctx.fillRect(-r*.6,r*.1,r*1.2,r*.12);
    for(const sx of [-1,1]){ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(sx*r*.5,-r*.6,r*.2,0,TAU);ctx.fill();ctx.fillStyle=eye;ctx.fillRect(sx*r*.5-2,-r*.66,4,r*.2);}
    ctx.fillStyle='#9be05a';for(let i=0;i<5;i++){ctx.beginPath();ctx.arc(-r*.6+i*r*.3,-r*.1+Math.sin(i*2)*5,4,0,TAU);ctx.fill();}
  }else if(f===9){
    ctx.save();ctx.rotate(t*.8);ctx.strokeStyle='rgba(197,139,255,.7)';ctx.lineWidth=3;ctx.setLineDash([8,6]);ctx.beginPath();ctx.arc(0,0,r*1.35,0,TAU);ctx.stroke();ctx.setLineDash([]);ctx.restore();
    ctx.fillStyle='#2a1a4a';ctx.beginPath();ctx.arc(0,0,r*1.05,0,TAU);ctx.fill();
    ctx.fillStyle='#f4eaff';ctx.beginPath();ctx.ellipse(0,0,r*.9,r*.6,0,0,TAU);ctx.fill();
    const a=Math.atan2(G.player.y-y,G.player.x-x);ctx.fillStyle=e.p2?'#ff3b3b':col;ctx.beginPath();ctx.arc(Math.cos(a)*r*.25,Math.sin(a)*r*.18,r*.34,0,TAU);ctx.fill();
    ctx.fillStyle='#12141c';ctx.beginPath();ctx.arc(Math.cos(a)*r*.3,Math.sin(a)*r*.22,r*.14,0,TAU);ctx.fill();
  }else{
    const fl=Math.sin(t*6)*6;ctx.fillStyle='#8a2f1c';
    ctx.beginPath();ctx.moveTo(-r*.3,-r*.2);ctx.lineTo(-r*1.5,-r*.9+fl);ctx.lineTo(-r*.9,r*.3);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(r*.3,-r*.2);ctx.lineTo(r*1.5,-r*.9+fl);ctx.lineTo(r*.9,r*.3);ctx.closePath();ctx.fill();
    ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,r*.15,r*.85,r*.8,0,0,TAU);ctx.fill();
    ctx.fillStyle='#ffb06b';ctx.beginPath();ctx.ellipse(0,r*.3,r*.5,r*.5,0,0,TAU);ctx.fill();
    ctx.fillStyle=col;ctx.fillRect(-r*.35,-r*.85,r*.7,r*.5);
    ctx.fillStyle='#f4e3c8';ctx.beginPath();ctx.moveTo(-r*.3,-r*.85);ctx.lineTo(-r*.5,-r*1.25);ctx.lineTo(-r*.1,-r*.85);ctx.fill();ctx.beginPath();ctx.moveTo(r*.3,-r*.85);ctx.lineTo(r*.5,-r*1.25);ctx.lineTo(r*.1,-r*.85);ctx.fill();
    ctx.fillStyle='#ffe36b';ctx.fillRect(-r*.28,-r*.7,r*.2,r*.14);ctx.fillRect(r*.08,-r*.7,r*.2,r*.14);
    ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(255,122,69,'+(.12+.08*Math.sin(t*8))+')';ctx.beginPath();ctx.arc(0,0,r*1.4,0,TAU);ctx.fill();ctx.globalCompositeOperation='source-over';

  if(SET.dn===0&&/^[\d.]+$/.test(String(s)))return;
  addTextOld(x,y,s,col,sc);
}
function killEnemy(e){
  const was=e.dead;killEnemyOld(e);
  if(was||!G||!SET.sk)return;
  if(G.kstT!==undefined&&G.t-G.kstT<2.5)G.kst=(G.kst||0)+1;else G.kst=1;
  G.kstT=G.t;
  const n=G.kst,p=G.player;
  if(n===10||n===25||n===50){const g=n===10?15:n===25?30:60;p.energy=Math.min(p.maxenergy,p.energy+g);addText(p.x,p.y-34,n+' 連殺！能量 +'+g,'#ffd166',1.3);sfx(880,.2,'triangle',.05,300);}
}
function drawHudV11(){
  if(!G||!SET.sk||G.pvp||G.wb)return;
  if(G.kst>=3&&G.t-(G.kstT||-9)<2.5){
    const k=1-(G.t-G.kstT)/2.5;
    ctx.textAlign='center';ctx.fillStyle='rgba(255,209,102,'+(.5+.5*k)+')';ctx.font=(14+Math.min(10,G.kst/5))+'px '+FONT;ctx.fillText('✨ '+G.kst+' 連殺',W/2,60);
    ctx.fillStyle='rgba(255,209,102,.5)';ctx.fillRect(W/2-30,66,60*k,3);
  }
}

function gachaPull(n,free){
  gachaInit();v10Init();const useTk=!free&&save.gacha.tk>=n,cost=free||useTk?0:n===10?G10_COST:G_COST*n;
  if(save.crystals<cost)return;

  gachaRes=[];let gotRare=false;
  for(let i=0;i<n;i++){
    save.gacha.n++;save.gacha.pity++;
    const leg=save.gacha.pity>=G_PITY;
    const res=gachaOne(!gotRare&&n===10&&i===9,leg,save.gacha.bn);save.gacha.sd+=(res.t==='legend'?20:res.t==='rare'?5:1);
    if(leg)save.gacha.pity=0;
    if(res.t==='rare'||res.t==='legend')gotRare=true;
    gachaRes.push(res);
  }
  persist();renderHub();gachaReveal(gachaRes.slice());
}

/* ---------- difficulty curve: easier early, much harder after floor 10 ---------- */
function diffF(){
  const d=G?depthF():0;
  if(d<10)return .62+.036*d;               // 0.62 → 0.98
  const x=d-9;return 1+.26*x+.05*x*x;       // floor 10: 1.4 ... floor 15: ~4.6 ... floor 20: ~14
}
function lateN(){return Math.max(0,(G?G.floor:1)-9);}
function hpMul(){return hpMulBase()*diffF()*(1+.12*((G&&G.curse)||0));}
function bossInfo(f){
  const b=bossInfoBase(f);
  if(G&&G.wb)return b;
  const x=Math.max(0,f-9);
  b.hp=Math.round(b.hp*(f<10?.7+.03*f:1+.3*x+.05*x*x));
  b.spd+=Math.min(60,x*5);
  return b;
}
function eFire(x,y,a,spd,dmg,col,r){
  const f=G?G.floor:1,l=lateN();
  eFireBase(x,y,a,spd*(f<=4?.88:1)*(1+Math.min(.6,.045*l)),dmg,col,r);
}
function hurt(d){
  const l=lateN();
  if(l>0&&d>0)d=Math.max(d,Math.round(d*(1+.14*l)));
  return hurtBase(d);
}
function spawnWave(){
  const before=G.enemies.length;
  spawnWaveBase();
  if(G.duel||G.roomType==='boss'||G.roomType==='challenge')return;
  const l=lateN();
  if(l>0){
    const extra=Math.min(14,Math.ceil(l*1.6));
    for(let i=0;i<extra;i++){
      const pos=randSpawnPos();if(!pos)continue;
      const t=pickType(),opt=(Math.random()<Math.min(.7,.2+.05*l)&&t!=='bomber')?eliteOpt(1):null;
      spawnAt(t,pos[0],pos[1],opt);
    }
  }else if(G.floor<=3){
    // easier early rooms: trim a couple of freshly spawned enemies
    let cut=G.floor===1?3:G.floor===2?2:1;
    while(cut-->0&&G.enemies.length>before+2){const e=G.enemies[G.enemies.length-1];G.enemies.pop();}
  }
}

function update(dt){
  updateBase(dt);
  if(!G||G.state!=='play')return;
  const p=G.player;
  if(G.mirrorT>0){
    G.mirrorT-=dt;
    for(const b of G.eb){
      if(b.dead)continue;
      if(Math.hypot(b.x-p.x,b.y-p.y)<80){
        b.dead=true;const a=Math.atan2(-b.vy,-b.vx);
        G.bullets.push(pb(b.x,b.y,a,520,4,14*p.st.dmg,1,'#e8f4ff',{pierce:1}));
      }
    }
  }
  if(G.bloodT>0){G.bloodT-=dt;if(G.bloodT<=0){p.hp=Math.min(p.maxhp,p.hp+2);addText(p.x,p.y-28,'血契結束 +2 生命','#ff3b55',1.2);}}
}

/* ---------- touch layout: floating stick, adjustable pad, left-hand mode ---------- */
const PADS={ps:[.85,1,1.2],po:[.45,.7,.95]};
function padApply(){
  try{
    if(!save.set)return;
    const s=save.set,r=document.documentElement;
    r.style.setProperty('--ps',String(s.ps||1));r.style.setProperty('--po',String(s.po||.7));
    const pad=$('pad');if(pad)pad.classList.toggle('lh',s.hd==='l');
  }catch(e){}
}
function padSettingsUI(box){
  if(!coarse)return;
  box.appendChild(el('b','','🕹️ 觸控按鍵'));
  const r=el('div','row2');
  const mk=(txt,fn)=>{const b=el('button','btn',txt);b.type='button';b.addEventListener('click',()=>{fn();persist();padApply();renderHub();});r.appendChild(b);};
  const idx=(k)=>{const v=save.set[k]||(k==='ps'?1:.7);let i=PADS[k].indexOf(v);return i<0?1:i;};
  mk('按鍵大小：'+['小','中','大'][idx('ps')],()=>{save.set.ps=PADS.ps[(idx('ps')+1)%3];});
  mk('按鍵透明度：'+['淡','中','濃'][idx('po')],()=>{save.set.po=PADS.po[(idx('po')+1)%3];});
  mk('慣用手：'+(save.set.hd==='l'?'左手（搖桿在右）':'右手（搖桿在左）'),()=>{save.set.hd=save.set.hd==='l'?'r':'l';});
  mk('浮動搖桿：'+(save.set.fl===0?'關':'開（橫向時點螢幕一側即出現）'),()=>{save.set.fl=save.set.fl===0?1:0;});
  box.appendChild(r);
}
(function(){
  if(!coarse)return;
  const stickEl=$('stick');
  const home=()=>{stickEl.style.left='';stickEl.style.top='';stickEl.style.bottom='';stickEl.classList.remove('float');};
  document.addEventListener('pointerdown',e=>{
    if(e.pointerType!=='touch'||!G||G.state!=='play')return;
    if(!matchMedia('(orientation:landscape)').matches)return;
    if(save.set&&save.set.fl===0)return;
    if(e.target.closest&&e.target.closest('button,.ov,input,.stick'))return;
    const left=!(save.set&&save.set.hd==='l');
    const x=e.clientX,w=innerWidth;
    if(left?x>w*.45:x<w*.55)return;
    const sz=stickEl.getBoundingClientRect().width||110;
    stickEl.classList.add('float');
    stickEl.style.left=Math.max(4,Math.min(w-sz-4,x-sz/2))+'px';
    stickEl.style.top=Math.max(4,Math.min(innerHeight-sz-4,e.clientY-sz/2))+'px';
    stickEl.style.bottom='auto';
    try{stickEl.dispatchEvent(new PointerEvent('pointerdown',{pointerId:e.pointerId,clientX:x,clientY:e.clientY,pointerType:'touch',bubbles:true}));}catch(err){}
  },true);
  const back=e=>{if(stickEl.classList.contains('float'))home();};
  stickEl.addEventListener('pointerup',back);stickEl.addEventListener('pointercancel',back);
  stickEl.addEventListener('lostpointercapture',back);
  document.addEventListener('contextmenu',e=>{if(G&&G.state==='play')e.preventDefault();});
  const bF=$('bFire');bF.addEventListener('lostpointercapture',()=>{touch.fire=false;});
  padApply();
})();
/* =====================================================================
   v16: affix gear + forge, random event rooms
   ===================================================================== */
const AFF={
 critd:{n:'爆傷',b:.15,s:.1,d:'暴擊傷害'},
 ls:{n:'擊殺回血',b:.04,s:.025,d:'擊殺時回復 1 生命的機率'},
 dodge:{n:'閃避',b:.03,s:.02,d:'完全閃避一次傷害的機率'},
 gem:{n:'魔晶加成',b:.08,s:.05,d:'出擊結算的魔晶增加'},
 rgn:{n:'再生',b:.05,s:.03,d:'生命再生速度'},
 frost:{n:'冰緩',b:.1,s:.06,d:'命中時使敵人減速的機率'}
};
const AFF_IDS=Object.keys(AFF);
function affVal(id,q){return Math.round((AFF[id].b+AFF[id].s*(q-1))*rnd(.85,1.15)*1000)/1000;}
function affCount(q){return q>=5?3:q>=4?2:q>=2?1:0;}
function sockN(it){return it.q>=5?2:it.q>=3?1:0;}
function affRoll(it){
  const ids=AFF_IDS.slice().sort(()=>Math.random()-.5).slice(0,affCount(it.q));
  it.aff=ids.map(id=>({id,v:affVal(id,it.q)}));
}
function affEnsure(it){
  if(!it)return it;
  if(!it.aff)affRoll(it);
  if(!it.sk)it.sk=[];
  return it;
}
function affText(a){return AFF[a.id].n+' +'+Math.round(a.v*100)+'%';}
function affSums(){
  const o={critd:0,ls:0,dodge:0,gem:0,rgn:0,frost:0};
  try{
    for(const [s] of GSLOTS){const it=eqGear(s);if(!it)continue;affEnsure(it);const m=1+.04*(it.lv||0);
      for(const a of it.aff)o[a.id]+=a.v*m;for(const a of it.sk)o[a.id]+=a.v*m;}
  }catch(e){}
  o.dodge=Math.min(.45,o.dodge);o.ls=Math.min(.5,o.ls);o.frost=Math.min(.8,o.frost);
  return o;
}
(function(){
  const mk=mkGear;
  mkGear=function(slot,q){const it=mk(slot,q);affRoll(it);it.sk=[];return it;};
  const gc=gearCard;
  gearCard=function(it,btns){
    const c=gc(it,btns);affEnsure(it);
    const add=[];
    for(const a of it.aff)add.push(el('small','','✦ '+affText(a)));
    for(const a of it.sk)add.push(el('small','','◈ 鑲嵌：'+affText(a)));
    if(sockN(it)>it.sk.length)add.push(el('small','','◇ 空鑲嵌孔 ×'+(sockN(it)-it.sk.length)));
    for(const x of add){if(c.insertBefore&&c.lastChild)c.insertBefore(x,c.lastChild);else c.appendChild(x);}
    return c;
  };
  const ke=killEnemy;
  killEnemy=function(e){
    ke(e);
    if(!G||!G.player)return;
    const a=affSums();
    if(a.ls>0&&Math.random()<a.ls&&G.player.hp<G.player.maxhp){G.player.hp=Math.min(G.player.maxhp,G.player.hp+1);addText(G.player.x,G.player.y-26,'+1','#ff7a8a',.8);}
  };
  const de=dmgEnemy;
  dmgEnemy=function(e,d,ang,crit,fx,leech){
    if(G&&G.player&&!G.duel){
      const a=affSums();
      if(crit&&a.critd>0)d*=1+a.critd;
      if(a.frost>0&&Math.random()<a.frost*.3)e.slow=Math.max(e.slow||0,1.2);
    }
    return de(e,d,ang,crit,fx,leech);
  };
  const h=hurt;
  hurt=function(d){
    if(G&&G.player&&d>0&&Math.random()<affSums().dodge){addText(G.player.x,G.player.y-26,'閃避','#8fe3ff',.9);return;}
    return h(d);
  };
  const er=endRun;
  endRun=function(r){
    const c0=save.crystals,res=er(r),gain=save.crystals-c0,a=affSums();
    if(gain>0&&a.gem>0){const b=Math.round(gain*a.gem);save.crystals+=b;persist();}
    return res;
  };
  const up=update;
  update=function(dt){
    up(dt);
    if(!G||G.state!=='play'||!G.player||G.duel)return;
    const a=affSums().rgn;if(a>0){G.rgnT=(G.rgnT||0)+dt;if(G.rgnT>=30/(1+a*10)){G.rgnT=0;if(G.player.hp<G.player.maxhp){G.player.hp++;addText(G.player.x,G.player.y-26,'再生','#6ee7b7',.8);}}}
  };
})();

/* ---------- forge panel (bag tab) ---------- */
let forgeSel=null,forgeAff='critd';
function forgePanel(box){
  box.appendChild(el('b','','⚒️ 裝備鍛造台（重鑄詞綴、鑲嵌詞綴孔）'));
  const items=save.gear.slice();
  if(!items.length){box.appendChild(el('p','note','還沒有裝備。'));return;}
  items.sort((a,b)=>b.q-a.q||b.lv-a.lv);
  if(!items.find(x=>x.uid===forgeSel))forgeSel=items[0].uid;
  const sel=document.createElement('select');sel.className='btn';
  for(const it of items){const o=document.createElement('option');o.value=it.uid;o.textContent=it.name+(it.lv?' +'+it.lv:'')+'（'+(GQP[it.q-1]||'普通')+'）'+(save.geareq[it.slot]===it.uid?'　［配戴中］':'');if(it.uid===forgeSel)o.selected=true;sel.appendChild(o);}
  sel.addEventListener('change',()=>{forgeSel=sel.value;renderHub();});
  box.appendChild(sel);
  const it=affEnsure(items.find(x=>x.uid===forgeSel));
  const card=el('div','item');card.style.borderColor=QC[it.q-1];
  card.append(el('b','',it.name));
  for(const k in it.stats)card.appendChild(el('small','',gearStatLine(it,k)));
  for(const a of it.aff)card.appendChild(el('small','','✦ '+affText(a)+'（'+AFF[a.id].d+'）'));
  for(const a of it.sk)card.appendChild(el('small','','◈ 鑲嵌：'+affText(a)));
  box.appendChild(card);
  const row=el('div','row2');
  const rc=Math.round(150*it.q*(1+.2*(it.lv||0))*(1-.05*((save.home&&save.home.b.forge&&save.home.b.forge.lv)||0)));
  const b1=el('button','btn','重鑄詞綴 💎'+rc);b1.type='button';b1.disabled=!it.aff.length||save.crystals<rc;
  b1.addEventListener('click',()=>{if(save.crystals<rc)return;save.crystals-=rc;affRoll(it);persist();toast('重鑄完成');renderHub();});
  row.appendChild(b1);
  const sn=sockN(it);
  if(sn){
    const as=document.createElement('select');as.className='btn';
    for(const id of AFF_IDS){const o=document.createElement('option');o.value=id;o.textContent=AFF[id].n+'（'+AFF[id].d+'）';if(id===forgeAff)o.selected=true;as.appendChild(o);}
    as.addEventListener('change',()=>{forgeAff=as.value;});
    row.appendChild(as);
    const ic=Math.round(250*it.q);
    const b2=el('button','btn',(it.sk.length>=sn?'覆蓋最舊的鑲嵌':'鑲嵌')+' 💎'+ic);b2.type='button';b2.disabled=save.crystals<ic;
    b2.addEventListener('click',()=>{if(save.crystals<ic)return;save.crystals-=ic;if(it.sk.length>=sn)it.sk.shift();it.sk.push({id:forgeAff,v:affVal(forgeAff,it.q)});persist();toast('鑲嵌完成');renderHub();});
    row.appendChild(b2);
    if(it.sk.length){const b3=el('button','btn','拆除鑲嵌');b3.type='button';b3.addEventListener('click',()=>{it.sk=[];persist();renderHub();});row.appendChild(b3);}
  }else row.appendChild(el('small','','品質達史詩（藍紫）以上才有鑲嵌孔'));
  box.appendChild(row);
}

const TABX={};
function cdxInit(){
  if(!save.cdx)save.cdx={};
  for(const k of ['mon','boss','relic','skill','evt','claim'])if(!save.cdx[k])save.cdx[k]={};
  if(!save.stats2)save.stats2={};
  const s=save.stats2;
  for(const k of ['fd','fr','sk','ch'])if(!s[k])s[k]={};
  if(!s.runs)s.runs=[];
  if(!s.dd)s.dd=0;if(!s.dt)s.dt=0;
  if(!save.set)save.set={vol:1,fx:1,bgm:1};
}
(function(){
  const ke=killEnemy;
  killEnemy=function(e){
    const was=e.dead;ke(e);
    if(was||!G||G.duel||G.pvp)return;
    try{cdxInit();if(e.isBoss)save.cdx.boss[(e.type||'b')]=1;else if(e.type)save.cdx.mon[e.type]=(save.cdx.mon[e.type]||0)+1;}catch(x){}
  };
  const tr=takeRelic;
  takeRelic=function(rid){tr(rid);try{cdxInit();save.cdx.relic[rid]=1;}catch(x){}};
  const cs=castSkill;
  castSkill=function(slot){
    const s=G&&G.sk&&G.sk[slot],id=s&&s.id,cd=s?s.cd:0,st=G?G.state:'';
    cs(slot);
    if(id&&st==='play'&&s.cd>0&&cd<=0){G.skUse=G.skUse||{};G.skUse[id]=(G.skUse[id]||0)+1;try{cdxInit();save.cdx.skill[id]=1;}catch(x){}}
  };
  const de=dmgEnemy;
  dmgEnemy=function(e,d,ang,crit,fx,leech){
    const a=e.dead?0:Math.min(d,e.hp);
    de(e,d,ang,crit,fx,leech);
    if(G&&!G.duel&&a>0&&G.player&&!e.ally)G.dmgD=(G.dmgD||0)+a;
  };
  const h=hurt;
  hurt=function(d){const hp=G&&G.player?G.player.hp+(G.player.armor||0):0;const r=h(d);if(G&&G.player){const lost=hp-(G.player.hp+(G.player.armor||0));if(lost>0)G.dmgT=(G.dmgT||0)+lost;}return r;};
  const ee=endRun;
  endRun=function(r){if(G&&G.state==='play')G.retreatF=!!r;return ee(r);};
  const fr=finishRun;
  finishRun=function(){
    const mode=G.tower?'tower':G.daily?'daily':G.weekly?'weekly':G.wb?'wb':'run';
    const rep=fr();
    try{
      cdxInit();const s=save.stats2,f=G.floor;
      for(let i=1;i<=f;i++)s.fr[i]=(s.fr[i]||0)+1;
      if(!G.retreatF)s.fd[f]=(s.fd[f]||0)+1;
      for(const id in (G.skUse||{}))s.sk[id]=(s.sk[id]||0)+G.skUse[id];
      const cid=G.ch.id;s.ch[cid]=s.ch[cid]||{n:0,f:0};s.ch[cid].n++;s.ch[cid].f+=f;
      s.dd+=G.dmgD||0;s.dt+=G.dmgT||0;
      s.runs.unshift({ts:Date.now(),ch:cid,f,k:G.kills,m:mode,r:G.retreatF?1:0,t:Math.round(G.t||0),dd:Math.round(G.dmgD||0),dt:Math.round(G.dmgT||0),sk:Object.keys(G.skUse||{}).sort((a,b)=>G.skUse[b]-G.skUse[a]).slice(0,2)});
      if(s.runs.length>30)s.runs.length=30;
      if(!G.retreatF&&mode==='run'){s.streak=f<=4?(s.streak||0)+1:0;}else if(mode==='run')s.streak=0;
    }catch(x){}
    return rep;
  };
  // dex seeding for existing saves
  const v=v11Init;
  v11Init=function(){v();cdxInit();for(const id of (save.skills||[]))save.cdx.skill[id]=save.cdx.skill[id]||0;};
})();

function assistMul(){cdxInit();return (save.stats2.streak||0)>=3&&diffSet().id!=='hard'&&diffSet().id!=='nightmare'?.85:1;}
(function(){

  const eg=endRun;
})();

const TREE_LV=[3,6,10,15];
function treeHash(s){let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h;}
function treeOpts(cid,tier){
  const h=treeHash(cid+tier),a=h%TREE_POOL.length;let b=(Math.floor(h/7)+1+tier*3)%TREE_POOL.length;if(b===a)b=(b+1)%TREE_POOL.length;
  return [TREE_POOL[a],TREE_POOL[b]];
}
function treeInit(){if(!save.tree)save.tree={};}
function treeBonus(id){
  if(!G||!G.ch||G.duel)return 0;
  const t=save.tree&&save.tree[G.ch.id];if(!t)return 0;
  let v=0;t.forEach((ix,tier)=>{if(ix===undefined||ix===null)return;const o=treeOpts(G.ch.id,tier)[ix];if(o&&o.e[id])v+=o.e[id]*(tier>=3?2:1);});
  return v;
}

function resolveBet(ref,kind,v){
  const p=G.player,x=ref.x,y=ref.y+30;
  fxAdd('shock',ref.x,ref.y,.4,{r:40,col:'#ffd166',th:4});
  if(kind==='flip'){

    else{addText(ref.x,ref.y-24,'猜錯… -'+v,'#8e97b5',1.2);sfx(150,.2,'sawtooth',.05,-60);}
    return;
  }
  const q=Math.random()+luck()*.05;
  let tier=SLOT_TIERS[SLOT_TIERS.length-1];

  parts2(x,y,10+mult*2,'#ffd166',170,.7,3,'s',0,true);sfx(700+mult*40,.3,'triangle',.06,300+mult*30);
  const scale=Math.min(1.2,.3*v/gambleCost());

/* ---- Supabase adapters that mimic the Claude-artifact db / room APIs, so every online feature works unchanged ---- */
function mkSbDb(sb,uid){
  const parse=p=>{const i=p.indexOf('/');return {coll:p.slice(0,i),id:p.slice(i+1)};};
  return {
    doc(path){
      const {coll,id}=parse(path);
      return {
        async set(data){
          const r=await sb.from('docs').upsert({coll,doc_id:id,uid,data,updated_at:new Date().toISOString()},{onConflict:'coll,doc_id'});
          if(r.error){const e=new Error(r.error.message);e.code=r.error.code;throw e;}
        },
        async get(){
          const r=await sb.from('docs').select('data').eq('coll',coll).eq('doc_id',id).maybeSingle();
          if(r.error)throw r.error;
          return {exists:!!r.data,data:()=>r.data?r.data.data:undefined};
        }
      };
    },
    collection(name){
      let f='score',n=20;
      const q={
        orderBy(field){f=['score','dmg','ts'].includes(field)?field:'updated_at';return q;},
        limit(x){n=x;return q;},
        onSnapshot(cb,err){
          let alive=true,t=null;
          const run=async()=>{
            if(!alive)return;
            try{
              const r=await sb.from('docs').select('data').eq('coll',name).order(f,{ascending:false,nullsFirst:false}).limit(n);
              if(r.error)throw r.error;
              cb({docs:r.data.map(x=>({data:()=>x.data}))});
            }catch(e){if(err)err(e);}
          };
          run();
          const iv=setInterval(run,12000);
          let ch=null;
          try{ch=sb.channel('docs-'+name+'-'+Math.random().toString(36).slice(2,8)).on('postgres_changes',{event:'*',schema:'public',table:'docs',filter:'coll=eq.'+name},()=>{clearTimeout(t);t=setTimeout(run,500);}).subscribe();}catch(e){}
          return ()=>{alive=false;clearInterval(iv);clearTimeout(t);try{if(ch)sb.removeChannel(ch);}catch(e){}};
        }
      };
      return q;
    }
  };
}
function mkSbRoomNs(sb){
  return {async join(name){
    const me='p'+Math.random().toString(36).slice(2,10);
    const Hd={},peers={},pcbs=[];let mine,lastSend=0,alive=true;
    const ch=sb.channel('room:'+name,{config:{broadcast:{self:false,ack:false}}});
    const fire=()=>pcbs.slice().forEach(f=>{try{f();}catch(e){}});
    const sendP=()=>{if(mine===undefined)return;try{ch.send({type:'broadcast',event:'__p',payload:{id:me,p:mine}});}catch(e){}};
    ch.on('broadcast',{event:'*'},m=>{
      const ev=m.event,pl=m.payload;
      if(ev==='__p'){if(!pl||pl.id===me)return;const isNew=!peers[pl.id];peers[pl.id]={presence:pl.p,at:Date.now()};if(isNew){fire();sendP();}}
      else if(ev==='__bye'){if(pl&&peers[pl.id]){delete peers[pl.id];fire();}}
      else (Hd[ev]||[]).slice().forEach(f=>{try{f({isMe:false,data:pl});}catch(e){}});
    });
    await new Promise((res,rej)=>{ch.subscribe(st=>{if(st==='SUBSCRIBED')res();else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED')rej(new Error(st));});});
    const hb=setInterval(()=>{
      if(!alive)return;sendP();
      const now=Date.now();let ch2=false;for(const k in peers)if(now-peers[k].at>6000){delete peers[k];ch2=true;}
      if(ch2)fire();
    },2000);
    return {
      async presence(o){mine=o;const now=Date.now();if(now-lastSend>=80){lastSend=now;sendP();}},
      peers(){const a=[{isMe:true,sameTab:true,peer:me,kind:'viewer',presence:mine}];for(const k in peers)a.push({isMe:false,sameTab:false,peer:k,kind:'viewer',presence:peers[k].presence});return a;},
      emit(t,d){try{ch.send({type:'broadcast',event:t,payload:d});}catch(e){}},
      on(t,f){(Hd[t]=Hd[t]||[]).push(f);return()=>{Hd[t]=(Hd[t]||[]).filter(x=>x!==f);};},
      onPeers(f){pcbs.push(f);return()=>{const i=pcbs.indexOf(f);if(i>=0)pcbs.splice(i,1);};},
      leave(){alive=false;clearInterval(hb);try{ch.send({type:'broadcast',event:'__bye',payload:{id:me}});}catch(e){}setTimeout(()=>{try{sb.removeChannel(ch);}catch(e){}},250);}
    };
  }};
}

  if(k==='escape'||k==='p'){togglePause();return;}
  if(G&&G.perkChoice&&k>='1'&&k<='3'){choosePerk(+k-1);return;}
  if(!G||G.state!=='play')return;
  if(k==='e'||k==='enter')interact();
  else if(k==='q')swapWeapon();
  else if(k===' ')castSkill(0);
  else if(k==='r'||k==='f')castSkill(1);
  else if(k==='t'){G.auto=!G.auto;addText(G.player.x,G.player.y-28,G.auto?'自動瞄準 開':'自動瞄準 關','#e9ecf5');}
  else if(k==='shift')doDash();
  else if(k==='c')tryCapture();
  else if(k==='y'){openChat();}
  else if(k==='m'){muted=!muted;}
}
addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;
  const k=e.key.toLowerCase();
  if(G&&!gameEl.classList.contains('hidden')&&(k===' '||k.startsWith('arrow')))e.preventDefault();
  if(!keys[k])keyPressed(k);
  keys[k]=true;
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouse.down=false;if(G&&G.state==='play'&&!G.co)togglePause();});
function setMouse(e){
  const r=cv.getBoundingClientRect();
  mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height;
}
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')setMouse(e);});
cv.addEventListener('pointerdown',e=>{
  if(e.pointerType!=='mouse')return;
  setMouse(e);cv.focus({preventScroll:true});
  if(e.button===0)mouse.down=true;
  else if(e.button===2)castSkill(0);
});
addEventListener('pointerup',e=>{if(e.pointerType==='mouse'&&e.button===0)mouse.down=false;});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{if(G&&G.state==='play'){e.preventDefault();swapWeapon();}},{passive:false});

const stick=$('stick'),knob=$('knob');let sid=null;
function moveStick(e){
  const r=stick.getBoundingClientRect(),m=r.width/2;
  let dx=e.clientX-(r.left+m),dy=e.clientY-(r.top+m);
  const d=Math.hypot(dx,dy)||1,k=Math.min(1,d/m);
  dx=dx/d*k;dy=dy/d*k;
  touch.mx=Math.abs(dx)<.15?0:dx;touch.my=Math.abs(dy)<.15?0:dy;
  knob.style.transform='translate('+(dx*m*.6)+'px,'+(dy*m*.6)+'px)';
}
stick.addEventListener('pointerdown',e=>{sid=e.pointerId;try{stick.setPointerCapture(e.pointerId);}catch(x){}moveStick(e);});
stick.addEventListener('pointermove',e=>{if(e.pointerId===sid)moveStick(e);});
const endStick=e=>{if(e.pointerId===sid){sid=null;touch.mx=touch.my=0;knob.style.transform='';}};
stick.addEventListener('pointerup',endStick);stick.addEventListener('pointercancel',endStick);
const bF=$('bFire');
bF.addEventListener('pointerdown',e=>{touch.fire=true;try{bF.setPointerCapture(e.pointerId);}catch(x){}});
const endF=()=>{touch.fire=false;};
bF.addEventListener('pointerup',endF);bF.addEventListener('pointercancel',endF);
$('bSkill').addEventListener('pointerdown',()=>castSkill(0));
$('bSkill2').addEventListener('pointerdown',()=>castSkill(1));
$('bSwap').addEventListener('pointerdown',()=>swapWeapon());
$('bUse').addEventListener('pointerdown',()=>interact());
$('bDash').addEventListener('pointerdown',()=>doDash());
$('bCap').addEventListener('pointerdown',()=>tryCapture());
$('bChat').addEventListener('pointerdown',()=>openChat());

/* ---------- loop ---------- */
let last=0,frameErr=0;
const CAPS={parts:260,texts:30,fx:100,rings:60,bolts:60,trail:80,swings:40,eb:450,bullets:350};
const MOB=/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
function capState(){
  const g=G;if(!g)return;
  const hard=MOB?120:180;
  if(g.enemies.length>hard){for(let i=g.enemies.length-1;i>=0&&g.enemies.length>hard;i--){const e=g.enemies[i];if(!e.boss&&!e.isBoss)g.enemies.splice(i,1);}}
  for(const k in CAPS){const a=g[k];if(Array.isArray(a)&&a.length>CAPS[k])a.splice(0,a.length-CAPS[k]);}
}
const spawnWaveCap=spawnWave;
spawnWave=function(){
  const g=G,before=g?g.enemies.length:0;
  spawnWaveCap.apply(this,arguments);
  if(!g)return;
  const MAXE=/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)?70:110; /* 同屏怪物上限，避免手機卡死/閃退 */
  if(g.enemies.length>MAXE){
    for(let i=g.enemies.length-1;i>=before&&g.enemies.length>MAXE;i--){const e=g.enemies[i];if(!e.boss&&!e.isBoss)g.enemies.splice(i,1);}
  }
};
function frame(ts){
  requestAnimationFrame(frame); /* 先排下一幀：單幀出錯也不會讓整個迴圈停掉（避免凍結/閃退） */
  try{
    const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
    if(G&&(G.state==='play'||G.state==='over')&&!(G.perkChoice&&!G.co))update(dt);
    capState();
    render();
    frameErr=0;
  }catch(e){
    frameErr++;
    try{console.error('frame error',e);}catch(_){}
    try{if(G)for(const k in CAPS)if(Array.isArray(G[k]))G[k].length=0;}catch(_){}
    if(frameErr>=20){ /* 連續出錯：保存進度並安全回大廳，而不是卡死 */
      frameErr=0;
      try{persist();}catch(_){}
      try{showMenu();}catch(_){}
    }
  }
}
window.addEventListener('error',e=>{try{console.error('uncaught',e.message);}catch(_){}});
window.addEventListener('unhandledrejection',e=>{try{e.preventDefault();}catch(_){}});
loadLocal();
renderHub();
requestAnimationFrame(frame);
netInit();
})();
</script>
